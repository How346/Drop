name: Build HyperDrop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.24.5"

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate platform scaffolding
        working-directory: flutter_app
        run: flutter create --platforms=android,windows --org com.hyperdrop --project-name hyperdrop .

      - name: Apply Android permissions
        working-directory: flutter_app
        run: python3 ../.github/scripts/patch_android_manifest.py

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hyperdrop-android-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows EXE
    # Pin the image so Flutter 3.24.x always finds the supported Visual Studio
    # 2022 C++ desktop toolchain. `windows-latest` can move to a newer image
    # whose Visual Studio installation this Flutter release cannot detect.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Generate platform scaffolding
        working-directory: flutter_app
        run: flutter create --platforms=android,windows --org com.hyperdrop --project-name hyperdrop .

      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Build release EXE
        working-directory: flutter_app
        run: |
          flutter clean
          flutter build windows --release

      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path flutter_app/build/windows/x64/runner/Release/* -DestinationPath hyperdrop-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: hyperdrop-windows
          path: hyperdrop-windows.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/hyperdrop-android-apk/app-release.apk
            dist/hyperdrop-windows/hyperdrop-windows.zip
