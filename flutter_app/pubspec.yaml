name: hyperdrop
description: HyperDrop — offline high-speed peer-to-peer file transfer for Android and Windows.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  file_picker: ^8.1.2
  crypto: ^3.0.3
  convert: ^3.1.1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  network_info_plus: ^5.0.3
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
